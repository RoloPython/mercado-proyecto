{% extends "base.html" %}
{% block title %}Registro{% endblock %}
{% block content %}
<h2>Crear cuenta</h2>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit" class="btn btn-primary">Registrarme</button>
</form>
<p>¿Ya tienes cuenta? <a href="{% url 'login' %}">Inicia sesión aquí</a></p>
{% endblock %}
