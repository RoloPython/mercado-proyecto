{% extends 'base.html' %}
{% block title %}Lista de Ventas{% endblock %}

{% block content %}

<h1>Lista de Ventas</h1>
<ul>
    {% for venta in ventas %}
        <li>{{ venta.producto.nombre }} vendido a {{ venta.cliente.nombre }} el {{ venta.fecha }}</li>
    {% endfor %}
</ul>
<a href="{% url 'agregar_venta' %}">Registrar nueva venta</a>
{% endblock %}
